# Общие блоки переменных, чтобы не дублировать между сервисами
x-logging: &logging
  LOGGING_LEVEL: ${LOGGING_LEVEL}

x-minio-auth: &minio-auth
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

x-rabbitmq-auth: &rabbitmq-auth
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

services:

  plc:
    build:
      context: .
      dockerfile: docker/m0_plc/Dockerfile
    container_name: plc
    environment:
      <<: *logging
      TCP_HOST: 0.0.0.0
      TCP_PORT: "4096"
      PLC_INTERVAL_SEC: ${PLC_INTERVAL_SEC}
    ports:
      - "${TCP_PORT}:4096"
    restart: unless-stopped
    networks:
      - robotech

  api:
    build:
      context: .
      dockerfile: docker/m1_api/Dockerfile
    container_name: api
    environment:
      <<: *logging
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DB_PATH: /data/excercise.db
    volumes:
      - ./excercise.db:/data/excercise.db
    ports:
      - "${API_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - robotech

  camera:
    build:
      context: .
      dockerfile: docker/m2_camera/Dockerfile
    container_name: camera
    environment:
      <<: [*logging, *minio-auth, *rabbitmq-auth]
      TCP_HOST: plc
      TCP_PORT: "4096"
      WS_HOST: 0.0.0.0
      WS_PORT: "1234"
      IMAGES_DIR: /frames
      API_BASE_URL: http://api:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT}
      MINIO_BUCKET: ${MINIO_BUCKET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
    volumes:
      - ./backend_test:/frames:ro
    ports:
      - "${WS_PORT}:1234"
    depends_on:
      plc:
        condition: service_started
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minioClient:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - robotech

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      <<: *rabbitmq-auth
      TZ: ${TZ}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - robotech

  minio:
    image: ${MINIO_IMAGE}
    container_name: minio
    environment:
      <<: *minio-auth
      TZ: ${TZ}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - min_data:/bitnami/minio/data
    command: server /bitnami/minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - robotech

  minioClient:
    image: ${MC_IMAGE}
    container_name: minio_client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing myminio/${MINIO_BUCKET} &&
        mc anonymous set public myminio/${MINIO_BUCKET}
      "
    restart: "no"
    networks:
      - robotech

  web:
    image: nginx:alpine
    container_name: web_client
    ports:
      - "${WEB_PORT}:8080"
    volumes:
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/web/static:/usr/share/nginx/html:ro
    depends_on:
      - api
      - camera
    restart: unless-stopped
    networks:
      - robotech

volumes:
  min_data:
  rmq_data:

networks:
  robotech:
    driver: bridge
